[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "kajamite"
version = "0.4.0"
description = "Shared knowledge access through namespaces, built on Basic Memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Nico (nicoell)"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]
basic-memory = ["mcp==2.1.1"]

[project.scripts]
kajamite = "kajamite.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kajamite"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "skills", "docs", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "requirements.lock", ".github"]
