name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - name: Install independent acceptance backend
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python -m venv .backend
          if [ "$RUNNER_OS" = Windows ]; then
            .backend/Scripts/python.exe -m pip install basic-memory==0.23.0
          else
            .backend/bin/python -m pip install basic-memory==0.23.0
          fi
      - name: Real backend continuity
        if: matrix.python == '3.12'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tests/commission.py --basic-memory "$PWD/.backend/Scripts/basic-memory.exe"
          else
            python tests/commission.py --basic-memory "$PWD/.backend/bin/basic-memory"
          fi
